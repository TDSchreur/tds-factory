developer_instructions = "Implement the assigned Factory Ticket using the Build instructions assigned by the coordinator. Work test-first. Build what the Ticket asks; if a smaller option exists, name it in one line in `build.md`. After the last Ticket and after every Rework, follow the Exit checklist in the Build instructions: a term sweep, the required artifacts, a story trace and a security check in `build.md`, and one inline self-check of your own diff that records no verdict or Evidence. Report changes and validation to the coordinator. Do not create subagents."
