name: eval

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names separated by spaces; empty runs all
        required: false
        default: ''
      model:
        description: Claude model id
        required: false
        default: claude-haiku-5-5
      timeout_minutes:
        description: Minutes allowed per scenario, 1 to 15
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    name: Eval (Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Install the Factory and Claude Code
        run: |
          npm install -g .
          npm install -g @anthropic-ai/claude-code@2.1.314
          claude --version
      - name: Check the inputs
        env:
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_SCENARIOS: ${{ inputs.scenarios }}
          EVAL_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          [[ "$EVAL_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "invalid model"; exit 1; }
          [[ "$EVAL_SCENARIOS" =~ ^[a-z -]*$ ]] || { echo "invalid scenarios"; exit 1; }
          [[ "$EVAL_MINUTES" =~ ^([1-9]|1[0-5])$ ]] || { echo "invalid timeout"; exit 1; }
      - name: Run the scenarios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_SCENARIOS: ${{ inputs.scenarios }}
          EVAL_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          export EVAL_TIMEOUT_MS=$((EVAL_MINUTES * 60000))
          export EVAL_AGENT_CMD="claude -p \"\$EVAL_PROMPT\" --dangerously-skip-permissions --model $EVAL_MODEL"
          # shellcheck disable=SC2086
          npm run eval -- claude $EVAL_SCENARIOS
