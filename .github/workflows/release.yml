name: release

# A release PR from develop to main publishes when it merges. workflow_dispatch on main retries a failed run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so releases never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.4', 'lts/*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_BROWSER: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Put the runner's ChromeDriver on PATH
        run: echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - run: npm run test:browser

  release:
    if: github.ref == 'refs/heads/main'
    needs: [verify, browser]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Take the version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Bump the version in package.json in the release PR."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack
          mv "tds-factory-$VERSION.tgz" tds-factory.tgz
          sha256sum tds-factory.tgz > tds-factory.tgz.sha256
      - name: Verify the exact tarball before publishing
        run: npm run test:package -- tds-factory.tgz
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" tds-factory.tgz tds-factory.tgz.sha256 scripts/install.sh scripts/install.ps1 --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
      - name: Check that the install URLs serve the published files
        env:
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          for pair in tds-factory.tgz:tds-factory.tgz tds-factory.tgz.sha256:tds-factory.tgz.sha256 install.sh:scripts/install.sh install.ps1:scripts/install.ps1; do
            name=${pair%%:*}
            file=${pair#*:}
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
              --output downloaded "$GITHUB_REPOSITORY_URL/releases/latest/download/$name"
            cmp "$file" downloaded
          done
          sha256sum --check tds-factory.tgz.sha256
