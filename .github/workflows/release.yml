name: release

on:
  workflow_dispatch:

# One run at a time, so releases never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', 'lts/*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  browser:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_BROWSER: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Put the runner's ChromeDriver on PATH
        run: echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - run: npm run test:browser

  release:
    if: github.ref == 'refs/heads/master'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Pick the version
        id: version
        run: |
          mapfile -t tags < <(git tag --list 'v*')
          version=$(node scripts/next-version.js "$(node -p "require('./package.json').version")" "${tags[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack with that version, without a commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack
          mv "tds-factory-$VERSION.tgz" tds-factory.tgz
          sha256sum tds-factory.tgz > tds-factory.tgz.sha256
      - name: Verify the exact tarball before publishing
        run: npm run test:package -- tds-factory.tgz
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" tds-factory.tgz tds-factory.tgz.sha256 --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
      - name: Check that the install URL in the README serves the published tarball
        env:
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --output downloaded.tgz "$GITHUB_REPOSITORY_URL/releases/latest/download/tds-factory.tgz"
          cmp tds-factory.tgz downloaded.tgz
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --output downloaded.sha256 "$GITHUB_REPOSITORY_URL/releases/latest/download/tds-factory.tgz.sha256"
          cmp tds-factory.tgz.sha256 downloaded.sha256
          sha256sum --check tds-factory.tgz.sha256
