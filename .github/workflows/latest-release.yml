name: latest-release

# The README installs from releases/latest/download/tds-factory.tgz. A Release that is Latest but
# lacks that file breaks every install with a 404, so check it whenever a Release changes and daily.
on:
  release:
    types: [published, edited, released, deleted]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      # A Release created by hand gets its file a moment later, so retry before failing.
      - name: The latest Release serves tds-factory.tgz
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 20 --retry-all-errors \
            --output /dev/null "$GITHUB_REPOSITORY_URL/releases/latest/download/tds-factory.tgz" \
            || { echo "::error::The latest Release has no tds-factory.tgz, so the README install command returns 404. Run the release workflow or attach the file."; exit 1; }
