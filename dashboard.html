<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tds-factory dashboard</title>
<script id="theme-init">
(function () {
  var key = 'dashboard-theme';
  var choice = 'system';
  try {
    var saved = localStorage.getItem(key);
    if (saved === 'light' || saved === 'dark' || saved === 'system') choice = saved;
  } catch (err) {}
  document.documentElement.dataset.theme = choice;
  document.addEventListener('DOMContentLoaded', function () {
    var selector = document.getElementById('theme');
    selector.value = choice;
    selector.addEventListener('change', function () {
      choice = selector.value;
      document.documentElement.dataset.theme = choice;
      try { localStorage.setItem(key, choice); } catch (err) {}
    });
  });
})();
</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #e9ecf0; --card: #fff; --text: #1b1f24; --muted: #5b6570;
    --border: #cdd3da; --ok: #1a7f37; --flag: #b42318; --flag-bg: #fdecea; --amber: #9a5b00;
    --primary: #2457c5; --primary-text: #fff; --header-bg: rgba(246, 247, 249, .88);
    --radius: .5rem; --shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .06);
    --focus: rgba(36, 87, 197, .45);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171a; --panel: #1d2125; --card: #262b30; --text: #e6e9ec; --muted: #9aa5b0;
    --border: #3a4148; --ok: #56d364; --flag: #ff8a80; --flag-bg: #3b1f1d; --amber: #f5b942;
    --primary: #6e9bff; --primary-text: #0d1117; --header-bg: rgba(20, 23, 26, .88);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --focus: rgba(110, 155, 255, .5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      color-scheme: dark;
      --bg: #14171a; --panel: #1d2125; --card: #262b30; --text: #e6e9ec; --muted: #9aa5b0;
      --border: #3a4148; --ok: #56d364; --flag: #ff8a80; --flag-bg: #3b1f1d; --amber: #f5b942;
      --primary: #6e9bff; --primary-text: #0d1117; --header-bg: rgba(20, 23, 26, .88);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4); --focus: rgba(110, 155, 255, .5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-underline-offset: .15em; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .75rem 1.25rem; background: var(--header-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  #project, #status { color: var(--muted); font-size: .875rem; }
  #status.error { color: var(--flag); font-weight: 600; }
  header label { font-size: .875rem; color: var(--muted); margin-left: auto; }
  select, button { font: inherit; font-size: .875rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .3rem .7rem; cursor: pointer; transition: border-color .15s, background-color .15s; }
  select:hover, button:hover { border-color: var(--primary); }
  button:active { background: var(--panel); }

  #board { display: grid; grid-template-columns: repeat(6, minmax(12rem, 1fr)); gap: 1rem; padding: 1.25rem; overflow-x: auto; align-items: start; }
  .column { background: var(--panel); border-radius: calc(var(--radius) * 1.5); padding: .75rem; min-width: 0; }
  .column h2 { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin: .1rem .25rem .75rem; color: var(--muted); }
  .column > button { margin: 0 0 .75rem; }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: .625rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; overflow-wrap: anywhere; box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--primary); }
  .card .title { font-weight: 600; line-height: 1.3; }
  .card .activity { color: var(--muted); font-size: .875rem; margin-top: .25rem; }
  .card .agent { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
  .card.unreadable { border: 2px dashed var(--flag); background: var(--flag-bg); }
  .card.unreadable .title { color: var(--flag); }
  .card .updated { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
  .card .updated.stale { color: var(--amber); font-weight: 600; }
  .card .pr { font-size: .875rem; margin-top: .4rem; }
  .card > button, .details > button { margin-top: .6rem; }
  .card.abandoned { opacity: .7; }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; font-size: .75rem; }
  .chip { border: 1px solid var(--border); border-radius: 999px; padding: 0 .55rem; color: var(--muted); line-height: 1.5; }
  .chip.pass { color: var(--ok); border-color: var(--ok); }
  .chip.fail { color: var(--flag); border-color: var(--flag); }
  .chip.skipped { color: var(--muted); }

  .card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
  .card.waiting { border: 2px solid var(--flag); background: var(--flag-bg); }
  .card .reason { color: var(--flag); font-weight: 700; font-size: .875rem; margin-bottom: .3rem; }
  .empty { color: var(--muted); font-size: .875rem; padding: .25rem; }

  #detail { max-width: 60rem; margin: 0 1.25rem 1.5rem; padding: 1.25rem; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.5); box-shadow: var(--shadow); }
  #detail[hidden] { display: none; }
  #detail h2 { font-size: 1.25rem; margin: 0 0 .75rem; }
  #detail h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; margin: 1rem 0 0; color: var(--muted); }
  #detail pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; margin: .4rem 0 .75rem; font-size: .875rem; }

  @media (max-width: 48rem) {
    header { padding: .6rem 1rem; }
    header label { margin-left: 0; }
    #board { grid-template-columns: 1fr; padding: 1rem; }
    #detail { margin: 0 1rem 1rem; padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>tds-factory dashboard</h1>
  <span id="project"></span>
  <span id="status" role="status" aria-live="polite">Loading...</span>
  <label for="theme">Theme</label>
  <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <button id="older" type="button" hidden></button>
</header>
<main id="board" aria-label="Runs by Stage"></main>
<section id="detail" aria-label="Run detail" hidden></section>
<script>
(function () {
  'use strict';
  var COLUMNS = [
    { key: 'define', label: 'Define' },
    { key: 'prepare', label: 'Prepare' },
    { key: 'build', label: 'Build' },
    { key: 'check', label: 'Check' },
    { key: 'finish', label: 'Finish' },
    { key: 'done', label: 'Done' }
  ];
  var BASE_TITLE = document.title;
  var POLL_MS = 2000;
  var STALE_MS = 10 * 60 * 1000;
  var OLD_MS = 7 * 24 * 60 * 60 * 1000;
  var expanded = Object.create(null); // Done cards the user opened, by Run id; same lifetime as showOlder
  var showOlder = false; // lives here because render() rebuilds the board every poll
  var olderBtn = document.getElementById('older');
  var board = document.getElementById('board');
  var statusEl = document.getElementById('status');

  // Lenient reader: any field may be missing or of the wrong type; unknown fields are ignored.
  function str(v) { return typeof v === 'string' ? v.trim() : ''; }

  // Age in ms of an ISO timestamp, or null when missing/unparseable.
  function ageMs(iso) {
    var t = Date.parse(iso);
    return isNaN(t) ? null : Date.now() - t;
  }
  function ago(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.floor(m / 60) + ' h ago';
    return Math.floor(m / 1440) + ' d ago';
  }
  // Only http(s) links become anchors.
  function safeUrl(v) { var u = str(v); return /^https?:\/\//i.test(u) ? u : ''; }

  // An anchor that opens in a new tab when href is an http(s) URL; otherwise plain text in an anchor-less span.
  function link(text, href) {
    var url = safeUrl(href);
    if (!url) return el('span', null, text);
    var a = el('a', null, text);
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  // One card per Run.
  function renderCard(run) {
    var li = el('li', 'card' + (run.unreadable ? ' unreadable' : '') + (run.waiting ? ' waiting' : ''));
    li.dataset.id = run.id;
    if (run.id === selectedId) li.classList.add('selected');
    li.tabIndex = 0;
    li.addEventListener('click', function () { select(run.id); });
    li.addEventListener('keydown', function (e) { if (e.key === 'Enter') select(run.id); });
    if (run.waiting) li.appendChild(el('div', 'reason', 'Needs you' + (run.reason ? ': ' + run.reason : '')));
    li.appendChild(el('div', 'title', (run.unreadable ? 'Unreadable record: ' : '') + run.title));
    // Done cards keep their detail in a block that starts hidden, so the Done column stays short.
    var more = run.column === 'done' ? el('div', 'details') : li;
    if (run.activity) more.appendChild(el('div', 'activity', run.activity));
    var chips = el('div', 'chips');
    if (run.ticketsTotal) chips.appendChild(el('span', 'chip', Math.min(run.ticketsDone || 0, run.ticketsTotal) + '/' + run.ticketsTotal + ' tickets'));
    if (run.standards) chips.appendChild(el('span', 'chip ' + run.standards, 'Standards ' + run.standards));
    if (run.spec) chips.appendChild(el('span', 'chip ' + run.spec, 'Spec ' + run.spec));
    if (run.security) chips.appendChild(el('span', 'chip ' + run.security, 'Security ' + run.security));
    if (run.infrastructure) chips.appendChild(el('span', 'chip ' + run.infrastructure, 'Infrastructure ' + run.infrastructure));
    if (typeof run.loops === 'number') chips.appendChild(el('span', 'chip', 'loop ' + run.loops + '/2'));
    if (chips.childNodes.length) more.appendChild(chips);
    if (run.agent) more.appendChild(el('div', 'agent', 'Agent: ' + run.agent));
    var age = ageMs(run.updated);
    var active = run.column !== 'done' && !run.unreadable;
    li.appendChild(el('div', 'updated' + (age !== null && active && age > STALE_MS ? ' stale' : ''), 'Updated: ' + (age === null ? 'unknown' : ago(age))));
    if (run.status === 'abandoned') {
      li.classList.add('abandoned');
      li.appendChild(el('div', 'agent', 'Abandoned'));
    }
    if (run.column === 'done' && run.pr) {
      var p = el('div', 'pr');
      if (safeUrl(run.pr)) p.appendChild(link('Pull request', run.pr));
      else p.textContent = 'PR: ' + run.pr;
      more.appendChild(p);
    }
    if (run.column === 'done') {
      var del = el('button', null, 'Delete');
      del.type = 'button';
      del.setAttribute('aria-label', 'Delete ' + run.title);
      del.addEventListener('click', function (e) { e.stopPropagation(); removeRuns([run], 'Permanently delete "' + run.title + '" and its Run record and summaries?'); });
      del.addEventListener('keydown', function (e) { e.stopPropagation(); });
      more.appendChild(del);
      var open = !!expanded[run.id];
      more.hidden = !open;
      var toggle = el('button', null);
      toggle.type = 'button';
      // The name starts with the visible text so voice control can match it.
      function label() {
        toggle.textContent = expanded[run.id] ? 'Hide details' : 'Show details';
        toggle.setAttribute('aria-label', toggle.textContent + ': ' + run.title);
        toggle.setAttribute('aria-expanded', !!expanded[run.id]);
      }
      label();
      // Flips in place instead of re-rendering the board, so the toggle keeps keyboard focus.
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        expanded[run.id] = !expanded[run.id];
        more.hidden = !expanded[run.id];
        label();
      });
      toggle.addEventListener('keydown', function (e) { e.stopPropagation(); });
      li.appendChild(toggle);
      li.appendChild(more);
    }
    return li;
  }

  var selectedId = null;
  var lastEntries = [];
  var detailEl = document.getElementById('detail');
  var shown = null; // key of what the detail view currently shows, to avoid flicker on each poll

  function select(id) { selectedId = selectedId === id ? null : id; render(lastEntries); }

  function renderDetail(runs) {
    var run = selectedId && runs.filter(function (r) { return r.id === selectedId; })[0];
    if (!run) { shown = null; detailEl.hidden = true; detailEl.replaceChildren(); return; }
    var key = JSON.stringify([run.id, run.title, run.updated, run.files, run.links]);
    if (key === shown) return;
    shown = key;
    detailEl.hidden = false;
    var kids = [el('h2', null, run.title)];
    run.links.forEach(function (l) {
      var p = el('div', 'link');
      p.appendChild(link(l.label + ': ' + l.href, l.href));
      kids.push(p);
    });
    if (!run.files.length) kids.push(el('div', 'empty', 'No summaries yet'));
    run.files.forEach(function (name) {
      kids.push(el('h3', null, name));
      var pre = el('pre', null, 'Loading...');
      kids.push(pre);
      fetch('/files/' + encodeURIComponent(run.id) + '/' + encodeURIComponent(name), { cache: 'no-store' })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
        .then(function (t) { pre.textContent = t; })
        .catch(function (err) { pre.textContent = 'Cannot load ' + name + ' (' + err.message + ')'; });
    });
    detailEl.replaceChildren.apply(detailEl, kids);
  }

  async function removeRuns(runs, message) {
    if (!window.confirm(message)) return;
    var failed = [];
    for (var i = 0; i < runs.length; i++) {
      try {
        var response = await fetch('/api/runs/' + encodeURIComponent(runs[i].id), { method: 'DELETE' });
        if (!response.ok) failed.push(runs[i].title + ' (' + (await response.text()) + ')');
      } catch (err) { failed.push(runs[i].title); }
    }
    if (failed.length) window.alert('Could not delete: ' + failed.join(', '));
    poll();
  }

  function render(entries) {
    lastEntries = entries;
    var runs = (Array.isArray(entries) ? entries : []);
    var n = runs.filter(function (r) { return r.waiting; }).length;
    // Runs waiting on the user are never hidden.
    var older = runs.filter(function (r) { var a = ageMs(r.updated); return a !== null && a > OLD_MS && !r.waiting; });
    if (!showOlder) runs = runs.filter(function (r) { return older.indexOf(r) < 0; });
    olderBtn.hidden = older.length === 0;
    olderBtn.textContent = showOlder ? 'Hide older runs' : 'Show older (' + older.length + ')';
    // Newest first within a column; unreadable and undated records sort last.
    runs.sort(function (a, b) { return b.updated.localeCompare(a.updated) || a.id.localeCompare(b.id); });
    var cols = COLUMNS.map(function (c) {
      var section = el('section', 'column');
      section.dataset.stage = c.key;
      var h = el('h2', null, c.label);
      h.id = 'col-' + c.key;
      section.setAttribute('aria-labelledby', h.id);
      section.appendChild(h);
      if (c.key === 'done') {
        var doneRuns = lastEntries.filter(function (r) { return r.column === 'done'; });
        if (doneRuns.length) {
          var delAll = el('button', null, 'Delete all');
          delAll.type = 'button';
          delAll.addEventListener('click', function () { removeRuns(doneRuns, 'Permanently delete all ' + doneRuns.length + ' Done Runs and their records and summaries, including hidden older Runs?'); });
          section.appendChild(delAll);
        }
      }
      var list = el('ul', 'cards');
      var mine = runs.filter(function (r) { return r.column === c.key; });
      mine.forEach(function (r) { list.appendChild(renderCard(r)); });
      section.appendChild(list);
      if (!mine.length) section.appendChild(el('div', 'empty', 'No runs'));
      return section;
    });
    board.replaceChildren.apply(board, cols);
    renderDetail(runs);
    document.title = (n ? '(' + n + ') ' : '') + BASE_TITLE;
  }

  olderBtn.addEventListener('click', function () { showOlder = !showOlder; render(lastEntries); });

  function poll() {
    fetch('/api/views', { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        render(data);
        statusEl.className = '';
        statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
      })
      .catch(function (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Cannot reach the server (' + err.message + '); showing last data. Retrying...';
      });
  }

  fetch('/api/info', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (info) { document.getElementById('project').textContent = str(info.project); })
    .catch(function () {});

  render([]);
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
