<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tds-factory dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #e9ecf0; --card: #fff; --text: #1b1f24; --muted: #5b6570;
    --border: #cdd3da; --flag: #b42318; --flag-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --panel: #1d2125; --card: #262b30; --text: #e6e9ec; --muted: #9aa5b0;
      --border: #3a4148; --flag: #ff8a80; --flag-bg: #3b1f1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 1rem; align-items: baseline; padding: .75rem 1rem; }
  h1 { font-size: 1.1rem; margin: 0; }
  #status { color: var(--muted); font-size: .85rem; }
  #status.error { color: var(--flag); }
  #board { display: grid; grid-template-columns: repeat(6, minmax(10rem, 1fr)); gap: .75rem; padding: 0 1rem 1rem; overflow-x: auto; }
  .column { background: var(--panel); border-radius: 8px; padding: .5rem; min-width: 0; }
  .column h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; margin: .25rem .25rem .5rem; color: var(--muted); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: .6rem; overflow-wrap: anywhere; }
  .card .title { font-weight: 600; }
  .card .activity { color: var(--muted); margin-top: .2rem; }
  .card .agent { font-size: .8rem; color: var(--muted); margin-top: .4rem; }
  .card.unreadable { border: 2px dashed var(--flag); background: var(--flag-bg); }
  .card.unreadable .title { color: var(--flag); }
  .card { cursor: pointer; }
  .card.selected { outline: 2px solid var(--muted); }
  #detail { margin: 0 1rem 1rem; padding: .75rem; background: var(--panel); border-radius: 8px; }
  #detail[hidden] { display: none; }
  #detail h2 { font-size: 1rem; margin: 0 0 .5rem; }
  #detail pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: .5rem; margin: .25rem 0 .75rem; }
  #detail h3 { font-size: .85rem; margin: .5rem 0 0; color: var(--muted); }
  .card.waiting { border: 2px solid var(--flag); background: var(--flag-bg); }
  .card .reason { color: var(--flag); font-weight: 600; margin-top: .3rem; }
  .empty { color: var(--muted); font-size: .85rem; padding: .25rem; }
</style>
</head>
<body>
<header>
  <h1>tds-factory dashboard</h1>
  <span id="status" role="status" aria-live="polite">Loading...</span>
</header>
<main id="board" aria-label="Runs by Stage"></main>
<section id="detail" aria-label="Run detail" hidden></section>
<script>
(function () {
  'use strict';
  var COLUMNS = [
    { key: 'define', label: 'Define' },
    { key: 'prepare', label: 'Prepare' },
    { key: 'build', label: 'Build' },
    { key: 'check', label: 'Check' },
    { key: 'finish', label: 'Finish' },
    { key: 'done', label: 'Done' }
  ];
  var BASE_TITLE = document.title;
  var POLL_MS = 2000;
  var board = document.getElementById('board');
  var statusEl = document.getElementById('status');

  // Lenient reader: any field may be missing or of the wrong type; unknown fields are ignored.
  function str(v) { return typeof v === 'string' ? v.trim() : ''; }

  function strList(v) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === 'string' && x; }) : []; }

  // Spec, Tickets and PR links from the record; each may be a string or (tickets) an array.
  function readLinks(r) {
    var out = [];
    [['Spec', r.spec], ['Ticket', r.tickets], ['PR', r.pr]].forEach(function (p) {
      (Array.isArray(p[1]) ? p[1] : [p[1]]).forEach(function (v) { if (str(v)) out.push({ label: p[0], href: str(v) }); });
    });
    return out;
  }

  // Maps a /api/runs entry to the fields the page uses. Never throws.
  function readRun(entry) {
    var id = str(entry && entry.id);
    if (!entry || entry.unreadable || !entry.record || typeof entry.record !== 'object') {
      return { id: id, unreadable: true, title: id || 'Unknown run', activity: '', agent: '', waiting: false, reason: '', column: 'define', updated: '', files: strList(entry && entry.files), links: [] };
    }
    var r = entry.record;
    var status = str(r.status);
    var stage = str(r.stage).toLowerCase();
    var column = 'define';
    if (status === 'done' || status === 'abandoned') column = 'done';
    else if (COLUMNS.some(function (c) { return c.key === stage && c.key !== 'done'; })) column = stage;
    var active = status !== 'done' && status !== 'abandoned';
    return {
      id: id, unreadable: false, column: column,
      waiting: active && r.waiting_on_human === true, reason: str(r.waiting_reason),
      title: str(r.title) || id || 'Untitled run',
      activity: str(r.activity), agent: str(r.agent), updated: str(r.updated),
      files: strList(entry.files), links: readLinks(r)
    };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  // One card per Run. Extension point: add fields/chips here (tickets, verdicts, waiting, ...).
  function renderCard(run) {
    var li = el('li', 'card' + (run.unreadable ? ' unreadable' : '') + (run.waiting ? ' waiting' : ''));
    li.dataset.id = run.id;
    if (run.id === selectedId) li.classList.add('selected');
    li.tabIndex = 0;
    li.addEventListener('click', function () { select(run.id); });
    li.addEventListener('keydown', function (e) { if (e.key === 'Enter') select(run.id); });
    if (run.waiting) li.appendChild(el('div', 'reason', 'Needs you' + (run.reason ? ': ' + run.reason : '')));
    li.appendChild(el('div', 'title', (run.unreadable ? 'Unreadable record: ' : '') + run.title));
    if (run.activity) li.appendChild(el('div', 'activity', run.activity));
    if (run.agent) li.appendChild(el('div', 'agent', 'Agent: ' + run.agent));
    return li;
  }

  var selectedId = null;
  var lastRuns = [];
  var detailEl = document.getElementById('detail');
  var shown = null; // key of what the detail view currently shows, to avoid flicker on each poll

  function select(id) { selectedId = selectedId === id ? null : id; render(lastEntries); }

  function renderDetail() {
    var run = selectedId && lastRuns.filter(function (r) { return r.id === selectedId; })[0];
    if (!run) { shown = null; detailEl.hidden = true; detailEl.replaceChildren(); return; }
    var key = JSON.stringify([run.id, run.title, run.updated, run.files, run.links]);
    if (key === shown) return;
    shown = key;
    detailEl.hidden = false;
    var kids = [el('h2', null, run.title)];
    run.links.forEach(function (l) {
      var p = el('div', 'link');
      var a = el('a', null, l.label + ': ' + l.href);
      if (/^(https?:)\/\//i.test(l.href)) { a.href = l.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      p.appendChild(a);
      kids.push(p);
    });
    if (!run.files.length) kids.push(el('div', 'empty', 'No summaries yet'));
    run.files.forEach(function (name) {
      kids.push(el('h3', null, name));
      var pre = el('pre', null, 'Loading...');
      kids.push(pre);
      fetch('/files/' + encodeURIComponent(run.id) + '/' + encodeURIComponent(name), { cache: 'no-store' })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
        .then(function (t) { pre.textContent = t; })
        .catch(function (err) { pre.textContent = 'Cannot load ' + name + ' (' + err.message + ')'; });
    });
    detailEl.replaceChildren.apply(detailEl, kids);
  }

  var lastEntries = [];
  function render(entries) {
    lastEntries = entries;
    var runs = (Array.isArray(entries) ? entries : []).map(readRun);
    lastRuns = runs;
    // Newest first within a column; unreadable and undated records sort last.
    runs.sort(function (a, b) { return b.updated.localeCompare(a.updated) || a.id.localeCompare(b.id); });
    var cols = COLUMNS.map(function (c) {
      var section = el('section', 'column');
      section.dataset.stage = c.key;
      var h = el('h2', null, c.label);
      h.id = 'col-' + c.key;
      section.setAttribute('aria-labelledby', h.id);
      section.appendChild(h);
      var list = el('ul', 'cards');
      var mine = runs.filter(function (r) { return r.column === c.key; });
      mine.forEach(function (r) { list.appendChild(renderCard(r)); });
      section.appendChild(list);
      if (!mine.length) section.appendChild(el('div', 'empty', 'No runs'));
      return section;
    });
    board.replaceChildren.apply(board, cols);
    renderDetail();
    var n = runs.filter(function (r) { return r.waiting; }).length;
    document.title = (n ? '(' + n + ') ' : '') + BASE_TITLE;
  }

  function poll() {
    fetch('/api/runs', { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        render(data);
        statusEl.className = '';
        statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
      })
      .catch(function (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Cannot reach the server (' + err.message + '); showing last data. Retrying...';
      });
  }

  render([]);
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
